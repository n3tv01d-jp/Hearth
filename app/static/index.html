<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HEARTH // 起動選択</title>
<meta name="theme-color" content="#05060d">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M16 2 29 9.5v13L16 30 3 22.5v-13z' fill='%2305060d' stroke='%233ef3ff' stroke-width='2'/%3E%3Cpath d='M16 8c3 4 5 6 5 10a5 5 0 0 1-10 0c0-2 1-3 2-4 0 2 1 3 2 3 0-3-1-5 1-9z' fill='%23ff3ea5'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&family=Share+Tech+Mono&family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script>
// old dashboard deep links (/?node=…) keep working
if (/[?&]node=/.test(location.search)) location.replace('hearth.html' + location.search + location.hash);
try{var t=new URLSearchParams(location.search).get('theme')||localStorage.getItem('hearth.theme');if(t&&t!=='hearth')document.documentElement.dataset.theme=t}catch(e){}
</script>
<style>
  .front { position: relative; z-index: 1; min-height: 100vh; display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: 36px; padding: 40px 16px; }
  .front-head { text-align: center; }
  .front-head h1 { margin: 0; font: 900 clamp(26px, 5vw, 44px) var(--f-disp); letter-spacing: .28em; color: var(--text);
    text-shadow: 0 0 18px rgba(var(--a1-rgb), .45); }
  .front-head p { margin: 6px 0 0; font: 13px var(--f-mono); letter-spacing: .3em; color: var(--dim); }
  .front-head p b { color: var(--a2); font-weight: 400; }

  .slots { display: grid; grid-template-columns: repeat(3, minmax(0, 260px)); gap: clamp(14px, 3vw, 32px); width: 100%; justify-content: center; }
  .slot { --c: var(--a1); --c-rgb: var(--a1-rgb);
    position: relative; display: flex; flex-direction: column; aspect-ratio: 9 / 16; text-decoration: none; color: var(--text);
    background: var(--panel); clip-path: var(--chamfer); isolation: isolate;
    transition: transform .25s ease, filter .25s ease; }
  /* chamfered border: an outer gradient layer behind a 1px-inset fill */
  .slot::before { content: ""; position: absolute; inset: 0; z-index: -2; clip-path: var(--chamfer);
    background: linear-gradient(160deg, rgba(var(--c-rgb), .9), rgba(var(--c-rgb), .15) 45%, rgba(var(--a2-rgb), .6)); }
  .slot::after { content: ""; position: absolute; inset: 1px; z-index: -1; clip-path: var(--chamfer); background: var(--bg2); }

  .slot-no { position: absolute; top: 12px; left: 14px; z-index: 2; font: 700 11px var(--f-disp); letter-spacing: .2em; color: var(--c); }
  .slot-art { position: relative; flex: 1; margin: 1px 1px 0; overflow: hidden; display: grid; place-items: center; }
  .slot-art img { width: 100%; height: 100%; object-fit: cover; transition: transform .6s ease; }
  .slot-art::after { content: ""; position: absolute; inset: 0;
    background: linear-gradient(180deg, transparent 55%, var(--bg2)), repeating-linear-gradient(0deg, rgba(255,255,255,.03) 0 1px, transparent 1px 3px); }
  .slot-info { padding: 14px 16px 20px; }
  .slot-info h2 { margin: 0; font: 900 clamp(15px, 2.2vw, 22px) var(--f-disp); letter-spacing: .2em; }
  .slot-info .jp { display: block; margin-top: 2px; font: 12px var(--f-jp); color: var(--dim); letter-spacing: .2em; }
  .slot-info .go { display: inline-block; margin-top: 12px; padding: 5px 12px; border: 1px solid rgba(var(--c-rgb), .6);
    font: 700 10px var(--f-disp); letter-spacing: .2em; color: var(--c); }

  a.slot:hover, a.slot:focus-visible { transform: translateY(-6px); filter: drop-shadow(0 0 18px rgba(var(--c-rgb), .45)); outline: none; }
  a.slot:hover .slot-art img, a.slot:focus-visible .slot-art img { transform: scale(1.05); }
  a.slot:hover .go, a.slot:focus-visible .go { background: rgba(var(--c-rgb), .15); }

  /* GATE art (inline SVG, follows the theme) */
  .slot-art svg.art { width: 100%; height: 100%; }
  .art-rings circle { stroke: var(--a1); opacity: .35; transform-origin: 140px 186px; }
  .art-rings .ar1 { stroke-dasharray: 4 8; animation: artspin 18s linear infinite; }
  .art-rings .ar2 { stroke: var(--a2); stroke-dasharray: 30 14 4 14; animation: artspin 28s linear infinite reverse; }
  .art-rings .ar3 { stroke-dasharray: 2 10; opacity: .2; animation: artspin 40s linear infinite; }
  .art-gate path { fill: none; stroke: var(--a2); filter: drop-shadow(0 0 6px var(--a2)); }
  .ag-top { stroke-width: 12; } .ag-bar { stroke-width: 7; } .ag-post { stroke-width: 11; }
  .art-portal { fill: rgba(var(--a1-rgb), .14); stroke: var(--a1); stroke-width: 1.5; filter: drop-shadow(0 0 10px var(--a1)); animation: artpulse 3s ease-in-out infinite; }
  .art-sparks circle { fill: var(--a1); animation: artrise 4s linear infinite; }
  .art-sparks circle:nth-child(2) { animation-delay: -1s; } .art-sparks circle:nth-child(3) { animation-delay: -2.2s; }
  .art-sparks circle:nth-child(4) { animation-delay: -3s; } .art-sparks circle:nth-child(5) { animation-delay: -1.6s; }
  @keyframes artspin { to { transform: rotate(360deg); } }
  @keyframes artpulse { 50% { fill: rgba(var(--a1-rgb), .3); } }
  @keyframes artrise { from { transform: translateY(0); opacity: 0; } 20% { opacity: 1; } to { transform: translateY(-90px); opacity: 0; } }
  a.slot:hover .art-portal, a.slot:focus-visible .art-portal { fill: rgba(var(--a1-rgb), .4); }

  /* ARSENAL art */
  .art-grid path { fill: none; stroke: var(--a1); stroke-width: 1; opacity: .25; }
  .art-gear { transform-origin: 140px 160px; animation: artspin 24s linear infinite; }
  .art-gear path { fill: rgba(var(--a1-rgb), .08); stroke: var(--a1); stroke-width: 2; filter: drop-shadow(0 0 8px var(--a1)); }
  .art-gear circle { fill: var(--bg2); stroke: var(--a1); stroke-width: 2; }
  .art-wrench path { fill: none; stroke: var(--a2); stroke-width: 12; stroke-linecap: round; filter: drop-shadow(0 0 8px var(--a2)); }
  .art-wrench path + path { fill: var(--a2); stroke-width: 0; }
  .s-arsenal .art-sparks circle { fill: var(--amber); animation: artspark 1.6s ease-out infinite; transform-origin: 186px 130px; }
  .s-arsenal .art-sparks circle:nth-child(2) { animation-delay: -.4s; } .s-arsenal .art-sparks circle:nth-child(3) { animation-delay: -.9s; }
  .s-arsenal .art-sparks circle:nth-child(4) { animation-delay: -1.2s; } .s-arsenal .art-sparks circle:nth-child(5) { animation-delay: -.6s; }
  @keyframes artspark { from { transform: scale(.2); opacity: 1; } to { transform: scale(2.2); opacity: 0; } }
  a.s-arsenal:hover .art-gear, a.s-arsenal:focus-visible .art-gear { animation-duration: 6s; }

  /* locked slots */
  .slot.wip { --c: var(--faint); --c-rgb: 125, 147, 181; cursor: not-allowed; }
  .slot.wip .slot-art { background: repeating-linear-gradient(135deg, rgba(var(--c-rgb), .06) 0 14px, transparent 14px 28px); }
  .slot.wip .slot-art svg { width: 38%; color: var(--dim); opacity: .35; }
  .slot.wip h2 { color: var(--dim); }
  .slot.wip .go { border-style: dashed; color: var(--amber); border-color: rgba(255, 182, 62, .5); }

  .front-foot { font: 11px var(--f-mono); color: var(--faint); letter-spacing: .14em; }

  @media (max-width: 680px) {
    .slots { grid-template-columns: minmax(0, 300px); }
    .slot.wip { aspect-ratio: auto; flex-direction: row; min-height: 96px; }
    .slot.wip .slot-art { flex: 0 0 96px; }
    .slot.wip .slot-info { align-self: center; }
  }
  @media (prefers-reduced-motion: reduce) { .slot, .slot-art img { transition: none; } .slot-art svg.art * { animation: none !important; } }
</style>
</head>
<body>
<div class="bg-hex" aria-hidden="true"></div>
<div class="bg-scan" aria-hidden="true"></div>

<main class="front">
  <header class="front-head">
    <h1>SELECT SYSTEM</h1>
    <p>起動選択 · <b>3</b> SLOTS</p>
  </header>

  <nav class="slots" aria-label="Systems">
    <a class="slot" href="hearth.html">
      <span class="slot-no">01</span>
      <div class="slot-art"><img src="img/hearth.webp" alt="" width="560" height="640"></div>
      <div class="slot-info">
        <h2>HEARTH</h2><span class="jp">炉心監視システム</span>
        <span class="go">LAUNCH ▸</span>
      </div>
    </a>

    <a class="slot s-gate" href="gate.html">
      <span class="slot-no">02</span>
      <div class="slot-art" aria-hidden="true">
        <svg class="art" viewBox="0 0 280 320" preserveAspectRatio="xMidYMid slice">
          <defs>
            <radialGradient id="gGlow" cx="50%" cy="58%" r="45%">
              <stop offset="0" style="stop-color:var(--a1);stop-opacity:.75"/>
              <stop offset=".45" style="stop-color:var(--a3);stop-opacity:.25"/>
              <stop offset="1" style="stop-color:var(--a3);stop-opacity:0"/>
            </radialGradient>
          </defs>
          <rect width="280" height="320" fill="url(#gGlow)"/>
          <g class="art-rings" fill="none" stroke-width="1.2">
            <circle cx="140" cy="186" r="62" class="ar1"/><circle cx="140" cy="186" r="84" class="ar2"/><circle cx="140" cy="186" r="108" class="ar3"/>
          </g>
          <g class="art-gate" stroke-linecap="square">
            <path d="M48 92 Q140 70 232 92" class="ag-top"/><path d="M66 120h148" class="ag-bar"/>
            <path d="M84 96v196M196 96v196" class="ag-post"/><path d="M140 98v22" class="ag-bar"/>
          </g>
          <path d="M100 292V150h80v142" class="art-portal"/>
          <g class="art-sparks"><circle cx="122" cy="230" r="1.6"/><circle cx="156" cy="200" r="1.2"/><circle cx="140" cy="260" r="1.8"/><circle cx="166" cy="246" r="1.1"/><circle cx="114" cy="186" r="1.3"/></g>
        </svg>
      </div>
      <div class="slot-info">
        <h2>GATE</h2><span class="jp">転送門 · サービス</span>
        <span class="go">LAUNCH ▸</span>
      </div>
    </a>

    <a class="slot s-arsenal" href="arsenal.html">
      <span class="slot-no">03</span>
      <div class="slot-art" aria-hidden="true">
        <svg class="art" viewBox="0 0 280 320" preserveAspectRatio="xMidYMid slice">
          <defs>
            <radialGradient id="aGlow" cx="50%" cy="50%" r="50%">
              <stop offset="0" style="stop-color:var(--a2);stop-opacity:.55"/>
              <stop offset=".5" style="stop-color:var(--a3);stop-opacity:.18"/>
              <stop offset="1" style="stop-color:var(--a3);stop-opacity:0"/>
            </radialGradient>
          </defs>
          <rect width="280" height="320" fill="url(#aGlow)"/>
          <g class="art-grid"><path d="M0 250h280M0 272h280M0 296h280M140 230 20 320M140 230 260 320M140 230v90M140 230 80 320M140 230 200 320"/></g>
          <g class="art-gear"><path d="M140 88l10 2 4 13 12 6 12-6 8 7-6 12 5 12 13 4 1 11-13 4-4 12 6 12-7 8-12-6-12 6-4 12-11 1-4-13-12-5-12 6-8-7 6-12-5-12-13-4-1-11 13-4 4-12-6-12 7-8 12 6 12-5 4-13z"/><circle cx="140" cy="160" r="26"/></g>
          <g class="art-wrench"><path d="M92 214 176 130"/><path d="M170 110a24 24 0 0 0 28 32l-12-12 4-12 12-4 12 12a24 24 0 0 0-32-28z"/></g>
          <g class="art-sparks"><circle cx="186" cy="132" r="1.8"/><circle cx="196" cy="122" r="1.2"/><circle cx="178" cy="120" r="1.4"/><circle cx="202" cy="140" r="1.1"/><circle cx="190" cy="112" r="1.6"/></g>
        </svg>
      </div>
      <div class="slot-info">
        <h2>ARSENAL</h2><span class="jp">工廠 · 整備</span>
        <span class="go">LAUNCH ▸</span>
      </div>
    </a>
  </nav>

  <footer class="front-foot">HEARTH 炉心監視システム</footer>
</main>
</body>
</html>
